<!DOCTYPE html>
<html>
<head>
    <title>Table Class</title>
</head>
<body>
    <h1 align="center">Table</h1>
    <table align="center" border="1" cellpadding="10" cellspacing="0" bgcolor="yellow">
        <tr>
            <th colspan="3">Student Information</th>
        </tr>
        <tr>
            <th>Name</th>
            <th bgcolor="red">subject</th>
            <th>marks</th>
        </tr>
        <tr bgcolor="green">
            <td rowspan="2">Rahul</td>
            <td>HTML</td>
            <td>85</td>
        </tr>
        <tr>
            <td>CSS</td>
            <td>90</td>
        </tr>
        <tr>
            <td rowspan="2">Priya</td>
            <td>HTML</td>
            <td>88</td>
        </tr>
        <tr>
            <td>CSS</td>
            <td>92</td>
        </tr>

    </table>
</body>
</html>
