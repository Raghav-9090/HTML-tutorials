<!DOCTYPE html>
<html>
<head>
    <title>Table Practice</title>
</head>
<body>
    <h1>welcome</h1>
    <table border="1" cellpadding="5" cellspacing="0">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>course</th>
        </tr>
        <tr>
            <td>John</td>
            <td>25</td>
            <td>Computer Science</td>
        </tr>
        <tr>
            <td>Jane</td>
            <td>22</td>
            <td>Mathematics</td>
        </tr>
    </table>
    <ol type="arrow" reversed>
        <li>monday</li>
        <li>tuesday</li>
        <li>wednesday</li>
    </ol>
</body>
</html>
